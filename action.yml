name: 'Publish static site'
description: >
  Uploads a built static site directory to the internal publish-server,
  keyed only by a logical site name. No infrastructure paths or hostnames
  are ever visible to the calling workflow.

inputs:
  target:
    description: 'Logical site name - this is also its subdomain, e.g. "gravity-snake-editor"'
    required: true
  path:
    description: 'Directory containing the built site to publish'
    required: false
    default: 'dist'
  token:
    description: 'Publish-server bearer token - pass secrets.PUBLISH_TOKEN'
    required: true
  basic_auth:
    description: 'Enable HTTP Basic Auth for this site ("true"/"false")'
    required: false
    default: 'false'
  basic_auth_users:
    description: >
      Optional newline-separated list of "username:apr1-hash" pairs, already
      hashed (e.g. via `openssl passwd -apr1` or `htpasswd -nbm`) - never
      pass a plaintext password here. If basic_auth is enabled but this is
      left empty, the publish server falls back to its own configured
      default credentials.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - shell: bash
      # Values come in via env: rather than being interpolated directly into
      # the script text below. Basic-auth hashes and tokens routinely
      # contain "$" - substituting them straight into a run: block would let
      # bash try to expand pieces of them as if they were shell variables.
      # Going through env: and reading with "$NAME" avoids that entirely.
      env:
        PUBLISH_TARGET: ${{ inputs.target }}
        PUBLISH_PATH: ${{ inputs.path }}
        PUBLISH_TOKEN: ${{ inputs.token }}
        PUBLISH_BASIC_AUTH: ${{ inputs.basic_auth }}
        PUBLISH_BASIC_AUTH_USERS: ${{ inputs.basic_auth_users }}
      run: |
        set -euo pipefail

        if [ ! -d "$PUBLISH_PATH" ]; then
          echo "::error::path '$PUBLISH_PATH' does not exist or is not a directory"
          exit 1
        fi

        archive="/tmp/site-${PUBLISH_TARGET}.tar.gz"
        tar czf "$archive" -C "$PUBLISH_PATH" .

        args=(-s -X POST -H "Authorization: Bearer ${PUBLISH_TOKEN}")

        if [ "$PUBLISH_BASIC_AUTH" = "true" ]; then
          args+=(-H "X-Basic-Auth: enabled")
          if [ -n "$PUBLISH_BASIC_AUTH_USERS" ]; then
            # Collapse the newline-separated input into one comma-delimited
            # header value - the server expects it this way (HTTP servers
            # are allowed to merge repeated same-name headers, which would
            # otherwise scramble a multi-user list).
            joined="$(printf '%s' "$PUBLISH_BASIC_AUTH_USERS" | grep -v '^[[:space:]]*$' | paste -sd, -)"
            args+=(-H "X-Basic-Auth-User: ${joined}")
          fi
        fi

        response_file="$(mktemp)"
        http_code="$(curl "${args[@]}" -o "$response_file" -w '%{http_code}' \
          --data-binary @"$archive" "http://publish-server:8080/publish/${PUBLISH_TARGET}")"

        # curl -fsS would swallow the response body on a non-2xx status,
        # which is exactly the message you need to see to debug a rejected
        # publish (bad auth config, invalid target, etc). Check manually
        # instead so that message always makes it into the job log.
        if [ "$http_code" -ge 400 ]; then
          echo "::error::publish-server rejected the request (HTTP ${http_code}):"
          cat "$response_file"
          rm -f "$archive" "$response_file"
          exit 1
        fi

        cat "$response_file"
        rm -f "$archive" "$response_file"
